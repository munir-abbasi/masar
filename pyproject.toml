[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masar"
version = "0.1.0"
description = "High-precision, agent-ergonomic Hadith Takhrīj (variant discovery and bundling) engine"
readme = "AGENTS.md"
requires-python = ">=3.11"
authors = [
    { name = "Masar Contributors" }
]
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
ml = [
    "fastembed>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
masar = "masar.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/masar"]
